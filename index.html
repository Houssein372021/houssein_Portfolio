      .boot-grid {

        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
      }
      .boot-inner {
        position: relative;
        width: min(100%, 1280px);
        margin: 0 auto;
        display: grid;
        gap: 48px;
        align-items: center;
      }
      .boot-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 24px;
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.7);
        font-size: 12px;
        font-weight: 500;
      }
      .boot-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--accent);
      }
      .boot-title {
        margin: 0;
        max-width: 780px;
        font-size: clamp(2.25rem, 8vw, 4.5rem);
        line-height: 1.05;
        font-weight: 800;

        color: var(--primary);

        font-weight: 500;
      }
      .boot-copy {

        margin: 24px 0 0;
        color: var(--muted);
        font-size: 1.0625rem;
        line-height: 1.7;
      }
      .boot-actions {

        flex-wrap: wrap;
        gap: 12px;

        align-items: center;
        min-height: 44px;
        padding: 0 20px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--fg);
        text-decoration: none;
        font-weight: 600;

      .boot-action-primary {

        background: linear-gradient(135deg, #0f6e86, #1d9a78);

        width: 256px;
        height: 256px;

        border-radius: 24px;

        height: 100%;

      }
